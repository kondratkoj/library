<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
    <script src="scripts.js" defer></script>
</head>
<body>
  <header>
    <h2>Library of Arbitary Things</h2>
    <button id="open-dialog-button" class="dialog-button">Add New Book</button>
  </header>
  <dialog id="add-book-dialog">
    <form id="book-form">
      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" required>
      </div>
      <div class="form-group">
        <label for="author">Author</label>
        <input type="text" id="author" name="author" required>
      </div>
      <div class="form-group">
        <label for="pages">Number of Pages</label>
        <input type="number" id="pages" name="pages" required>
      </div>
      <div class="form-group">
        <label for="cover">Cover Page URL</label>
        <input type="text" id="cover" name="cover" >
      </div>
      <div class="form-group">
        <button type="submit" id="add-book-button">Add Book</button>
      </div>
    </form>
  </dialog>
  <main class="main-body">

  </main>
</body>
</html>
